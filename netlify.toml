[build]
  publish = "."

# Site de aprovação de layout: fora dos buscadores até virar lançamento.
# Remover este bloco (e o robots.txt) quando a loja for ao ar de verdade.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# v2 mora em /v2/ e usa as mesmas imagens de /assets/.
# Os arquivos proprios dela precisam da regra equivalente.
[[headers]]
  for = "/v2/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/v2/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
